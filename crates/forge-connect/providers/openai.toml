# Built-in provider definitions (openai), embedded at compile time.
# Fields: `ProviderSpec` in src/profile.rs.

[[providers]]
id = "openai"
title = "OpenAI"
label = "API"
provider = "openai"
provider_label = "OpenAI"
description = "OpenAI API key — openai/* models"
base_url = "https://api.openai.com/v1"
base_url_env = ["OPENAI_API_BASE"]
api_key_env = ["OPENAI_API_KEY"]
wire = "chat-completions"
attach = "bearer"
default_models = ["gpt-4.1-mini"]
models_dev_providers = ["openai"]
auth_url = "https://platform.openai.com/api-keys"
guidance = "Create a key at https://platform.openai.com/api-keys."
min_key_len = 16
billing_url = "https://platform.openai.com/usage"
billing_note = "OpenAI does not expose wallet balance through the API key API."
effort_family = "openai"
route_id = "openai-api"
catalog_mode = "live+registry"

[providers.auth]
kind = "api-key"

[providers.catalog]
filter = "chat"
kind = "openai-models"

[[providers]]
id = "openai_codex"
