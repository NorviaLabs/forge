[package]
name = "forge-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Remote control for Forge: one paired device follows sessions, sends prompts and answers approvals over pinned TLS."

[features]
# The fake backend and the pinned HTTPS client the tests drive the server
# with. Never enabled by the desktop app.
test-support = ["hyper/client"]

[dependencies]
forge-core = { workspace = true }
forge-session = { workspace = true }
forge-types = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
getrandom = "0.3"
hex = { workspace = true }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = "2"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
forge-remote = { path = ".", features = ["test-support"] }
forge-config = { workspace = true, features = ["fake-provider"] }
forge-session = { workspace = true, features = ["fake-provider"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
