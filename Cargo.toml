[workspace]
resolver = "2"
members = [
    "crates/forge-types",
    "crates/forge-sandbox",
    "crates/forge-config",
    "crates/forge-tools",
    "crates/forge-model",
    "crates/forge-durable",
    "crates/forge-core",
    "crates/forge-session",
    "crates/forge-mcp",
    "crates/forge-workspace",
    "crates/forge-cli",
    "crates/forge-governance",
    "crates/forge-context",
    "crates/forge-connect",
    "crates/forge-test-support",
    "crates/forge-storage",
    "crates/forge-search",
    # The Tauri desktop app, the product. On Linux it needs WebKitGTK and GTK
    # development packages (see .github/workflows/ci.yml).
    "crates/forge-desktop",
]

[workspace.package]
version = "0.1.0-beta.11"
edition = "2021"
license = "MIT"
repository = "https://github.com/NorviaLabs/forge"
rust-version = "1.97.1"

[workspace.dependencies]
async-trait = "0.1"
syn = { version = "2", features = ["full", "visit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
toml = "1.1"
serde_yaml = "0.9"
dirs = "7"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"] }
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ureq = { version = "3", features = ["json"] }
futures = "0.3"
bytes = "1"
jsonschema = "0.61"
regex = "1"
portable-pty = "0.9"
fff-search = "0.10.1"
fff-grep = "0.10.1"
fff-query-parser = "0.10.1"
similar = "3"

forge-types = { path = "crates/forge-types" }
forge-sandbox = { path = "crates/forge-sandbox" }
forge-config = { path = "crates/forge-config" }
forge-tools = { path = "crates/forge-tools" }
forge-model = { path = "crates/forge-model" }
forge-durable = { path = "crates/forge-durable" }
forge-core = { path = "crates/forge-core" }
forge-session = { path = "crates/forge-session" }
forge-mcp = { path = "crates/forge-mcp" }
forge-workspace = { path = "crates/forge-workspace" }
forge-governance = { path = "crates/forge-governance" }
forge-context = { path = "crates/forge-context" }
forge-connect = { path = "crates/forge-connect" }
forge-test-support = { path = "crates/forge-test-support" }
forge-storage = { path = "crates/forge-storage" }
forge-search = { path = "crates/forge-search" }
sha2 = "0.10"
hex = "0.4"

# Full debug info for ~500 dependencies, repeated in every test binary, made
# `target/` grow to tens of GB. Forge's own crates keep file:line backtraces;
# dependencies carry none. For a full-debug run of one build, set
# CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Default release: strip symbols so `forge` is not 5MB of leftover names.
# `dist` is the shipping profile (thin LTO). Not the default: every
# `cargo test --release` / render-perf run would pay the LTO tax.
[profile.release]
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

# RUSTSEC-2026-0459: the SQLite that sqlx 0.9.0 bundles (via libsqlite3-sys
# < 0.38) can return uninitialised memory for a crafted database and `-wal`
# pair, and Forge opens databases under the project's `.forge/local/`. sqlx's
# main branch allows the fixed libsqlite3-sys 0.39 but is unreleased, so the
# sqlx crates come from one pinned commit of it (still version 0.9.0). Remove
# this section, and the git allowance in deny.toml, once sqlx 0.9.1 or later
# is on crates.io.
[patch.crates-io]
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "fd56e1dffe74d4b6f9e7ce710bac02dd9026258e" }
sqlx-core = { git = "https://github.com/launchbadge/sqlx", rev = "fd56e1dffe74d4b6f9e7ce710bac02dd9026258e" }
sqlx-macros = { git = "https://github.com/launchbadge/sqlx", rev = "fd56e1dffe74d4b6f9e7ce710bac02dd9026258e" }
sqlx-macros-core = { git = "https://github.com/launchbadge/sqlx", rev = "fd56e1dffe74d4b6f9e7ce710bac02dd9026258e" }
sqlx-mysql = { git = "https://github.com/launchbadge/sqlx", rev = "fd56e1dffe74d4b6f9e7ce710bac02dd9026258e" }
sqlx-postgres = { git = "https://github.com/launchbadge/sqlx", rev = "fd56e1dffe74d4b6f9e7ce710bac02dd9026258e" }
sqlx-sqlite = { git = "https://github.com/launchbadge/sqlx", rev = "fd56e1dffe74d4b6f9e7ce710bac02dd9026258e" }
