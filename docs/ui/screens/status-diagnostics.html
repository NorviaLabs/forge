<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Forge TUI — Status / diagnostics</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="frame">
    <div class="statusbar">
      <div class="brand">forge</div>
      <span class="pill info">/status</span>
      <span class="sep">·</span>
      <span>provider/model</span>
      <span class="sep">·</span>
      <span>ctx 78.2%</span>
      <span class="sep">·</span>
      <span>cache 18 / 4</span>
      <div class="right">
        <span class="pill warn">awaiting</span>
        <span class="pill">profile</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">session status</div>
      <div class="grid">
        <div class="kv"><span>status</span><strong>running</strong></div>
        <div class="kv"><span>session</span><strong>8f3a1c2b</strong></div>
        <div class="kv"><span>provider</span><strong>native</strong></div>
        <div class="kv"><span>model</span><strong>model</strong></div>
        <div class="kv"><span>effort</span><strong>high</strong></div>
        <div class="kv"><span>ctx</span><strong>78.2%</strong></div>
        <div class="kv"><span>cache</span><strong>18 / 4</strong></div>
        <div class="kv"><span>tools</span><strong>12</strong></div>
      </div>
      <div class="mono">cache, context estimate, and tool count stay visible together.</div>
    </div>
  </div>
</body>
</html>
