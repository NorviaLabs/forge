[package]
name = "forge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forge CLI — launches the desktop app; `forge bench` runs one prompt headless; `forge models report` ranks models"
default-run = "forge"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
forge-config = { workspace = true }
forge-connect = { workspace = true }
forge-session = { workspace = true }
forge-tools = { workspace = true }
forge-types = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
forge-durable = { workspace = true }
forge-test-support = { workspace = true, features = ["turn-records"] }
assert_cmd = "2"
predicates = "3"
portable-pty = { workspace = true }
tempfile = { workspace = true }
