name: Build PR7 keyboard contract
on:
  push:
    branches:
      - refactor/multisession-07-keyboard-contract
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/multisession-07-keyboard-contract
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply and validate keyboard contract
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          # Reserve F3 semantically; retire Ctrl+Shift+T as Forge navigation.
          p = Path("crates/forge-tui/src/app/commands.rs")
          s = p.read_text()
          old = """            KeyCode::Char('t')
                          if key.modifiers.contains(KeyModifiers::CONTROL)
                              && key.modifiers.contains(KeyModifiers::SHIFT) =>
                      {
                          Some(SemanticCommand::OpenSessionSwitcher)
                      }
          """
          new = """            KeyCode::F(3) if key.modifiers.is_empty() => {
                          Some(SemanticCommand::OpenSessionSwitcher)
                      }
          """
          assert old in s, "global Ctrl+Shift+T Sessions binding not found"
          s = s.replace(old, new, 1)
          s = s.replace("SlashCommand::Tasks", "SlashCommand::Sessions")
          p.write_text(s)

          # F3 owns global Sessions navigation before focused surfaces and PTY
          # dispatch, except confirmations that deliberately retain ownership.
          p = Path("crates/forge-tui/src/app/input.rs")
          s = p.read_text()
          anchor = """        if self.explorer_dialog.is_open() {
                      self.handle_explorer_dialog_key(key);
                      return Ok(());
                  }

                  if self.context_menu.is_some() {
          """
          replacement = """        if self.explorer_dialog.is_open() {
                      self.handle_explorer_dialog_key(key);
                      return Ok(());
                  }

                  // F3 is Forge-reserved session navigation. Intercept it before
                  // context menus, HITL/questions, overlays, editor/transient input, or
                  // the embedded PTY can consume it. Destructive confirmations retain
                  // keyboard ownership until the operator resolves or cancels them.
                  if key.code == KeyCode::F(3) && key.modifiers.is_empty() {
                      let atomic_session_confirmation = matches!(
                          self.overlay,
                          Some(Overlay::SessionConfirm { .. } | Overlay::TrustSession { .. })
                      );
                      if !atomic_session_confirmation {
                          if matches!(self.overlay, Some(Overlay::SessionSwitcher { .. })) {
                              self.dismiss_overlay();
                          } else {
                              self.open_session_switcher();
                          }
                          return Ok(());
                      }
                  }

                  if self.context_menu.is_some() {
          """
          assert anchor in s, "input routing anchor not found"
          s = s.replace(anchor, replacement, 1)

          test_anchor = """    #[tokio::test]
              async fn release_events_are_ignored_but_arrow_repeats_are_honoured() {
          """
          tests = r"""    #[tokio::test]
              async fn f3_is_reserved_for_sessions_and_never_encoded_for_the_pty() {
                  let (_dir, app) = app().await;
                  let f3 = press(KeyCode::F(3));
                  assert_eq!(terminal_key_bytes(f3), None);
                  assert_eq!(
                      app.semantic_command_for_global_key(f3),
                      Some(SemanticCommand::OpenSessionSwitcher)
                  );

                  let old = press_with(
                      KeyCode::Char('t'),
                      KeyModifiers::CONTROL | KeyModifiers::SHIFT,
                  );
                  assert_eq!(app.semantic_command_for_global_key(old), None);
                  assert_eq!(terminal_key_bytes(old), Some(vec![20]));
              }

              #[tokio::test]
              async fn f3_opens_sessions_before_every_focused_surface_can_consume_it() {
                  for block in FocusBlock::ORDER {
                      let (_dir, mut app) = app().await;
                      app.focus.set_navigation(block);
                      app.handle_key(press(KeyCode::F(3))).await.unwrap();
                      assert!(
                          matches!(
                              app.overlay,
                              Some(Overlay::ResumePicker { .. } | Overlay::SessionSwitcher { .. })
                          ),
                          "F3 should open Sessions from {block:?}"
                      );
                  }

                  let (_dir, mut app) = app().await;
                  app.overlay = Some(Overlay::Help);
                  app.handle_key(press(KeyCode::F(3))).await.unwrap();
                  assert!(matches!(
                      app.overlay,
                      Some(Overlay::ResumePicker { .. } | Overlay::SessionSwitcher { .. })
                  ));

                  let (_dir, mut app) = app().await;
                  app.enter_transient(TransientOwner::JumpToLine);
                  app.handle_key(press(KeyCode::F(3))).await.unwrap();
                  assert!(matches!(
                      app.overlay,
                      Some(Overlay::ResumePicker { .. } | Overlay::SessionSwitcher { .. })
                  ));
              }

              #[tokio::test]
              async fn f3_does_not_escape_atomic_confirmations() {
                  let (_dir, mut app) = app().await;
                  app.explorer_dialog.show(ExplorerDialog::DirtyExit);
                  app.handle_key(press(KeyCode::F(3))).await.unwrap();
                  assert!(app.explorer_dialog.is_open());
                  assert!(app.overlay.is_none());

                  app.explorer_dialog.clear();
                  app.overlay = Some(Overlay::SessionConfirm {
                      kind: crate::overlays::SessionConfirmKind::Archive,
                      session_id: uuid::Uuid::new_v4().to_string(),
                      label: "session".into(),
                      detail: "archive this session".into(),
                  });
                  app.handle_key(press(KeyCode::F(3))).await.unwrap();
                  assert!(matches!(app.overlay, Some(Overlay::SessionConfirm { .. })));
              }

          """
          assert test_anchor in s, "input test insertion anchor not found"
          s = s.replace(test_anchor, tests + test_anchor, 1)
          p.write_text(s)

          # Make /sessions canonical while keeping /tasks as a compatibility alias.
          p = Path("crates/forge-tui/src/commands.rs")
          s = p.read_text()
          assert "    Tasks,\n" in s
          s = s.replace("    Tasks,\n", "    Sessions,\n", 1)
          old = """        "tasks" => {
                      if parts.next().is_some() {
                          Err(CommandError::Usage("/tasks".into()))
                      } else {
                          Ok(SlashCommand::Tasks)
                      }
                  }
          """
          new = """        "sessions" | "tasks" => {
                      if parts.next().is_some() {
                          Err(CommandError::Usage("/sessions".into()))
                      } else {
                          Ok(SlashCommand::Sessions)
                      }
                  }
          """
          assert old in s, "slash parser tasks block not found"
          s = s.replace(old, new, 1)
          s = s.replace("SlashCommand::Tasks", "SlashCommand::Sessions")
          old_test = """    #[test]
              fn tasks_opens_the_repository_task_switcher() {
                  assert_eq!(parse_slash("/tasks").unwrap().unwrap(), SlashCommand::Sessions);
                  assert!(parse_slash("/tasks now").unwrap().is_err());
              }
          """
          new_test = """    #[test]
              fn sessions_opens_the_repository_session_switcher() {
                  assert_eq!(
                      parse_slash("/sessions").unwrap().unwrap(),
                      SlashCommand::Sessions
                  );
                  assert_eq!(
                      parse_slash("/tasks").unwrap().unwrap(),
                      SlashCommand::Sessions
                  );
                  assert!(parse_slash("/sessions now").unwrap().is_err());
              }
          """
          assert old_test in s, "slash command test block not found"
          s = s.replace(old_test, new_test, 1)
          p.write_text(s)

          # Expose the canonical command in the palette.
          p = Path("crates/forge-tui/src/overlays.rs")
          s = p.read_text()
          anchor = """        PaletteItem {
                      cmd: "/fork".into(),
                      desc: "Start a new session from this conversation".into(),
                      is_skill: false,
                  },
          """
          addition = anchor + """        PaletteItem {
                      cmd: "/sessions".into(),
                      desc: "Switch, create, attach, and manage repository sessions".into(),
                      is_skill: false,
                  },
          """
          assert anchor in s, "palette /fork anchor not found"
          s = s.replace(anchor, addition, 1)
          p.write_text(s)

          # User-facing help/docs should advertise the canonical path.
          for root in [Path("crates/forge-tui/src"), Path("docs")]:
              for p in root.rglob("*"):
                  if not p.is_file() or p.suffix not in {".rs", ".md"}:
                      continue
                  if p == Path("crates/forge-tui/src/commands.rs"):
                      continue
                  s = p.read_text()
                  s2 = s.replace("Ctrl+Shift+T", "F3").replace("/tasks", "/sessions")
                  if s2 != s:
                      p.write_text(s2)
          PY
          cargo fmt --all
          git diff --check
          cargo check --workspace --all-targets --locked
          cargo test -p forge-tui --lib --locked
          git rm .github/workflows/_build_pr7.yml
          git add -A
          git commit -m "feat(tui): make F3 the global Sessions key"
          git push origin HEAD:refactor/multisession-07-keyboard-contract
