[workspace]
resolver = "2"
members = [
    "crates/forge-types",
    "crates/forge-config",
    "crates/forge-tools",
    "crates/forge-model",
    "crates/forge-durable",
    "crates/forge-core",
    "crates/forge-mcp",
    "crates/forge-tui",
    "crates/forge-cli",
    "crates/forge-governance",
    "crates/forge-context",
    "crates/forge-workspace",
    "crates/forge-feedback",
    "crates/forge-obs",
    "crates/forge-connect",
]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/NorviaLabs/forge"
rust-version = "1.86"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dirs = "6"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ureq = { version = "2", features = ["json"] }
futures = "0.3"
bytes = "1"
jsonschema = "0.28"
crossterm = "0.28"
ratatui = { version = "=0.30.0", default-features = false, features = ["crossterm_0_28", "underline-color", "layout-cache"] }

forge-types = { path = "crates/forge-types" }
forge-config = { path = "crates/forge-config" }
forge-tools = { path = "crates/forge-tools" }
forge-model = { path = "crates/forge-model" }
forge-durable = { path = "crates/forge-durable" }
forge-core = { path = "crates/forge-core" }
forge-mcp = { path = "crates/forge-mcp" }
forge-tui = { path = "crates/forge-tui" }
forge-governance = { path = "crates/forge-governance" }
forge-context = { path = "crates/forge-context" }
forge-workspace = { path = "crates/forge-workspace" }
forge-feedback = { path = "crates/forge-feedback" }
forge-obs = { path = "crates/forge-obs" }
forge-connect = { path = "crates/forge-connect" }
sha2 = "0.10"
hex = "0.4"
