name: Validate primary supervisor API
on:
  push:
    branches:
      - refactor/multisession-09-primary-supervisor-cutover
permissions:
  contents: read
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/multisession-09-primary-supervisor-cutover
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: |
          cargo fmt --all
          git diff --check
          cargo check --workspace --all-targets --locked
          cargo test -p forge-session --lib --locked
