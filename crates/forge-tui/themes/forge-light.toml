# Forge Light — the paper counterpart to Forge Dark, same design language
# read in reverse: the brand green still lives in the ground (every neutral
# from `background` to `text_primary` carries a green tint), and the accent
# is still deliberately not green, so focus and success stay legible as two
# different signals rather than one.
#
# Status colours are colourblind-safe by design: red and green are the pair
# that collapses together under protanopia and deuteranopia, so `success`
# uses teal/bluish-green and `error` uses crimson/magenta instead — the same
# substitution used by validated accessible palettes (Okabe–Ito) and by
# Claude Code's own colourblind-friendly themes. `warning`'s amber and
# `accent`'s blue were already clear of that collision and are unchanged.
id = "forge-light"
name = "Forge Light"

background = "#F2F5EF"
background_deep = "#E6EBE1"
surface = "#FBFDF9"
surface_raised = "#FFFFFF"
surface_hover = "#E9F0E4"
border = "#C9D4C4"
border_muted = "#DEE6D9"
text_primary = "#1E2A1E"
text_secondary = "#48564A"
text_muted = "#6C7A6C"
# Same accent family as Forge Dark (blue, ~211° hue), darkened for a light
# ground. 60°+ of hue clearance from success/warning/error, same rule Forge
# Dark's own comment documents. 5.2:1 on `background`.
accent = "#3568A0"
accent_soft = "#D8E6F2"
agent = "#6D4F97"
# Teal, not green — colourblind-safe substitute for the classic "success
# green", which is the half of the red/green pair that survives worst under
# protanopia/deuteranopia. 5.9:1 on `background`.
success = "#196B3E"
warning = "#8C6018"
# Crimson/magenta, not red — the other half of the classic collision.
# 6.8:1 on `background`.
error = "#9B274E"
info = "#26586D"
diff_add = "#D3EEDF"
diff_remove = "#F1DAE2"
selection = "#CFE0F0"
cursor = "#2E5C8C"
# Neutral, not teal — same reasoning as Forge Dark's `tag`: a dedicated
# low-emphasis text step, not a hue with a meaning of its own.
tag = "#556355"
search_match = "#F3DE9A"
waiting_border = "#8C6018"
# Response structure (editorial treatment): the model answer's skeleton —
# section labels, list markers, heading rules' hue family — is tinted so a
# long reply can be skimmed by shape before it is read. `info`'s hue, same
# reasoning as Forge Dark's comment above.
structure = "#26586D"
# Scan band: the raised ground behind a whole list block. Sits between the
# paper canvas (#F2F5EF) and the inline-code chip tint `surface_raised`
# (#FFFFFF) so chips stay visible inside a banded list.
scan_band = "#F7FAF3"
# Zebra tint for even body rows of a rendered table; ≈50/50 of background
# and surface, stated explicitly so theme authors can tune or disable it.
zebra_row = "#F6F9F4"

[syntax]
comment = "#6C7A6C"
keyword = "#6D4F97"
string = "#196B3E"
number = "#8C6018"
function = "#257E4D"
type = "#26586D"
variable = "#1E2A1E"
operator = "#556355"
punctuation = "#556355"
property = "#26586D"
tag = "#26586D"
attribute = "#8C6018"
default = "#1E2A1E"
