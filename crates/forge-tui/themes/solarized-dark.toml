# Solarized Dark — Ethan Schoonover's canonical Solarized palette
# (https://ethanschoonover.com/solarized/) mapped onto the Forge TUI's
# semantic theme schema. The eight base tones (base03..base3) and eight
# accent hues (yellow/orange/red/magenta/violet/blue/cyan/green) are the
# exact published values. UI chrome shades that Solarized itself doesn't
# define (surface elevation steps, soft/tinted backgrounds) are blended
# from those same base tones and accents to stay in-palette.
id = "solarized-dark"
name = "Solarized Dark"

background = "#002B36"
background_deep = "#002B36"
surface = "#073642"
surface_raised = "#113D48"
surface_hover = "#19424D"
border = "#586E75"
border_muted = "#274C56"
text_primary = "#839496"
text_secondary = "#657B83"
text_muted = "#586E75"
accent = "#268BD2"
accent_soft = "#073C52"
agent = "#6C71C4"
success = "#859900"
warning = "#B58900"
error = "#DC322F"
info = "#2AA198"
diff_add = "#14332B"
diff_remove = "#3B2320"
selection = "#02313F"
cursor = "#EEE8D5"
user_gutter_active = "#58A2D3"
tag = "#93A1A1"
search_match = "#284028"
waiting_border = "#B58900"
approval_accent = "#268BD2"

[syntax]
comment = "#586E75"
keyword = "#859900"
string = "#2AA198"
number = "#2AA198"
function = "#268BD2"
type = "#B58900"
variable = "#268BD2"
operator = "#859900"
punctuation = "#586E75"
property = "#268BD2"
tag = "#DC322F"
attribute = "#CB4B16"
default = "#839496"
