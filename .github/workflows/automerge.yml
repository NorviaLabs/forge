name: Auto-Merge

# Arms GitHub's native auto-merge on every PR so it merges itself once branch
# protection's requirements (CI checks, review approval) are satisfied. This
# workflow only decides *when to arm it*, not whether it's ready to merge —
# that's enforced by required status checks + required reviews on `main`
# (see repo branch protection settings), which is what `--auto` actually
# waits on.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    # Drafts can't be merged (GitHub rejects the request), and re-arming on
    # every push while still a draft is just noise. `ready_for_review` picks
    # it back up once the author un-drafts it.
    if: github.event.pull_request.draft == false
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
