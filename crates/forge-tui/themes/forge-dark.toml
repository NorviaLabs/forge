# Forge Dark — 2026 semantic tokens (see artifacts/astra-tui-2026/03-forge-design-system.md).
id = "forge-dark"
name = "Forge Dark"

background = "#14171B"
background_deep = "#101318"
surface = "#1D2229"
surface_raised = "#252C35"
# Ground hierarchy: surface < hover < selection, so a hovered row never reads
# as a selected one. Selection stays at the darkest step that keeps the muted
# `tag`/secondary grey at WCAG AA (4.5:1) on the selected ground.
surface_hover = "#2A333E"
border = "#394350"
border_muted = "#2A333E"
text_primary = "#EDF0F5"
text_secondary = "#B5BECB"
text_muted = "#9BA8BA"
accent = "#86B5FF"
accent_soft = "#26364D"
activity = "#E5BB80"
agent = "#B5BECB"
success = "#9BD1AD"
warning = "#F3C575"
error = "#EE94A0"
info = "#9FC9E2"
diff_add = "#183A28"
diff_remove = "#4A2026"
selection = "#344154"
cursor = "#86B5FF"
tag = "#B5BECB"
search_match = "#F3C575"
waiting_border = "#F3C575"
structure = "#B5BECB"
scan_band = "#14171B"
zebra_row = "#1D2229"
# Editorial emphasis inside model prose (never chrome/status/code).
# Warm emphasis remains distinct from the neutral activity and status chrome.
md_strong = "#FFA31D"
md_emph = "#C7D96B"
# Links stay distinct from the blue focus accent at ordinary prose weight.
link = "#4FC9DF"

[syntax]
comment = "#A0A0A0"
keyword = "#439EFD"
string = "#5BDB87"
number = "#1DB0BB"
function = "#EBEBEB"
type = "#1DB0BB"
variable = "#EBEBEB"
operator = "#A0A0A0"
punctuation = "#A0A0A0"
property = "#1DB0BB"
tag = "#1DB0BB"
attribute = "#E6C66A"
default = "#EBEBEB"
