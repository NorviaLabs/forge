[package]
name = "forge-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Forge desktop app (Tauri 2)."

[[bin]]
name = "forge-desktop"
path = "src/main.rs"

[features]
# Builds with `--self-test` (a scripted end-to-end check) and the scripted
# fake provider. Never enabled in release builds; such a build uses its own
# bundle identifier (see tauri.self-test.conf.json).
self-test = ["dep:tempfile", "forge-session/fake-provider"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = ["isolation"] }
serde_json = "1"

[dependencies]
tauri = { version = "=2.12.4", features = ["isolation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tempfile = { version = "3", optional = true }
forge-config = { path = "../forge-config" }
forge-core = { path = "../forge-core" }
forge-connect = { path = "../forge-connect" }
forge-session = { path = "../forge-session" }
# The `__egress-connect` helper git's SSH routing invokes on this executable.
forge-tools = { path = "../forge-tools" }
forge-types = { path = "../forge-types" }
forge-transcript = { path = "../forge-transcript" }
forge-workspace = { path = "../forge-workspace" }
dirs = "7"
portable-pty = "0.9"
base64 = "0.22"
sha2 = "0.10"
# Native folder picker for a launch with no meaningful working directory.
# Called directly rather than through the Tauri dialog plugin: plugins add IPC
# surface the webview could reach (see tests/config.rs).
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3", "common-controls-v6"] }

[dev-dependencies]
# Constructing a session snapshot in the bridge's roster tests.
chrono = "0.4"
