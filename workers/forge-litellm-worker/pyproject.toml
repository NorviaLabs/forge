[project]
name = "forge-litellm-worker"
version = "0.1.0"
description = "Forge Phase 5 LiteLLM SDK worker (library, not proxy)"
requires-python = ">=3.10"
dependencies = [
  "litellm>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
forge-litellm-worker = "forge_litellm_worker.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
