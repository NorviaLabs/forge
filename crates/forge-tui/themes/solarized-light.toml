# Solarized Light — Ethan Schoonover's canonical Solarized palette
# (https://ethanschoonover.com/solarized/) mapped onto the Forge TUI's
# semantic theme schema. The eight base tones (base03..base3) and eight
# accent hues (yellow/orange/red/magenta/violet/blue/cyan/green) are the
# exact published values. UI chrome shades that Solarized itself doesn't
# define (surface elevation steps, soft/tinted backgrounds) are blended
# from those same base tones and accents to stay in-palette.
id = "solarized-light"
name = "Solarized Light"

background = "#F5F0DE"
background_deep = "#F2EDDA"
surface = "#EDE8D7"
surface_raised = "#E5DFCC"
surface_hover = "#D9D5C4"
border = "#8F9D9B"
border_muted = "#B5B8AC"
text_primary = "#586E75"
text_secondary = "#657B83"
text_muted = "#93A1A1"
accent = "#268BD2"
accent_soft = "#D9E2DE"
agent = "#6C71C4"
success = "#859900"
warning = "#B58900"
error = "#DC322F"
info = "#2AA198"
diff_add = "#ECE9C3"
diff_remove = "#F8DBCA"
selection = "#E7E7D8"
cursor = "#586E75"
user_gutter_active = "#3384BB"
tag = "#657B83"
search_match = "#EFE0B6"
waiting_border = "#B58900"
approval_accent = "#268BD2"

[syntax]
comment = "#657B83"
keyword = "#6C7A00"
string = "#2A7F78"
number = "#2A7F78"
function = "#1D6FA5"
type = "#8B6500"
variable = "#1D6FA5"
operator = "#6C7A00"
punctuation = "#657B83"
property = "#1D6FA5"
tag = "#B52B29"
attribute = "#A33E12"
default = "#586E75"
