[workspace]
resolver = "2"
members = [
    "crates/forge-types",
    "crates/forge-config",
    "crates/forge-syntax",
    "crates/forge-tools",
    "crates/forge-model",
    "crates/forge-durable",
    "crates/forge-core",
    "crates/forge-session",
    "crates/forge-mcp",
    "crates/forge-transcript",
    "crates/forge-workspace",
    "crates/forge-tui",
    "crates/forge-cli",
    "crates/forge-governance",
    "crates/forge-context",
    "crates/forge-connect",
    "crates/forge-test-support",
    "crates/forge-storage",
    "crates/forge-search",
]

[workspace.package]
version = "0.1.0-beta.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/NorviaLabs/forge"
rust-version = "1.97.1"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "1.1"
serde_yaml = "0.9"
dirs = "6"
pathdiff = "0.2"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"] }
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ureq = { version = "3", features = ["json"] }
futures = "0.3"
bytes = "1"
jsonschema = "0.50"
crossterm = "0.29"
# `layout-cache` is one of ratatui's default features, so turning defaults off
# silently dropped it and every layout solve ran the constraint solver from
# scratch — the single largest source of per-frame allocations.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color", "unstable-rendered-line-info"] }
regex = "1"
pulldown-cmark = "0.13"
notify = "8"
portable-pty = "0.9"
vt100 = "0.16"
fff-search = "0.10.1"
fff-grep = "0.10.1"
fff-query-parser = "0.10.1"
similar = "3"
edtui = { version = "0.11.6", default-features = false }

forge-types = { path = "crates/forge-types" }
forge-config = { path = "crates/forge-config" }
forge-syntax = { path = "crates/forge-syntax" }
forge-tools = { path = "crates/forge-tools" }
forge-model = { path = "crates/forge-model" }
forge-durable = { path = "crates/forge-durable" }
forge-core = { path = "crates/forge-core" }
forge-session = { path = "crates/forge-session" }
forge-mcp = { path = "crates/forge-mcp" }
forge-transcript = { path = "crates/forge-transcript" }
forge-workspace = { path = "crates/forge-workspace" }
forge-tui = { path = "crates/forge-tui" }
forge-governance = { path = "crates/forge-governance" }
forge-context = { path = "crates/forge-context" }
forge-connect = { path = "crates/forge-connect" }
forge-test-support = { path = "crates/forge-test-support" }
forge-storage = { path = "crates/forge-storage" }
forge-search = { path = "crates/forge-search" }
sha2 = "0.10"
hex = "0.4"

# Default release: strip symbols so `forge` is not 5MB of leftover names.
# `dist` is the shipping profile (thin LTO). Not the default: every
# `cargo test --release` / render-perf run would pay the LTO tax.
[profile.release]
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
