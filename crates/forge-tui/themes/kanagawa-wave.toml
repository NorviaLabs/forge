# Kanagawa Wave — wave variant (https://github.com/rebelot/kanagawa.nvim)
# mapped onto the Forge TUI semantic theme schema. Sumi ink, Fuji, and wave
# accent hues use the published palette; syntax roles follow the upstream
# Kanagawa Wave highlight mapping.
id = "kanagawa-wave"
name = "Kanagawa Wave"

background = "#1F1F28"
background_deep = "#16161D"
surface = "#1A1A22"
surface_raised = "#2A2A37"
surface_hover = "#363646"
border = "#54546D"
border_muted = "#363646"
text_primary = "#DCD7BA"
text_secondary = "#C8C093"
text_muted = "#727169"
accent = "#7E9CD8"
accent_soft = "#223249"
agent = "#957FB8"
success = "#98BB6C"
warning = "#E6C384"
error = "#E82424"
info = "#7FB4CA"
diff_add = "#2B3328"
diff_remove = "#43242B"
selection = "#2D4F67"
cursor = "#DCD7BA"
tag = "#727169"
search_match = "#223249"
waiting_border = "#E6C384"

[syntax]
comment = "#727169"
keyword = "#957FB8"
string = "#98BB6C"
number = "#D27E99"
function = "#7E9CD8"
type = "#7AA89F"
variable = "#DCD7BA"
operator = "#7FB4CA"
punctuation = "#C8C093"
property = "#7AA89F"
tag = "#E46876"
attribute = "#E6C384"
default = "#DCD7BA"
