[package]
name = "forge-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Frontend-independent session assembly for Forge"

[dependencies]
forge-browser = { workspace = true }
forge-config = { workspace = true }
forge-connect = { workspace = true }
forge-core = { workspace = true }
forge-durable = { workspace = true }
forge-governance = { workspace = true }
forge-mcp = { workspace = true }
forge-model = { workspace = true }
forge-storage = { workspace = true }
forge-workspace = { workspace = true }
forge-tools = { workspace = true }
forge-types = { workspace = true }
forge-screen = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
fake-provider = ["forge-model/fake-provider", "forge-config/fake-provider"]

[dev-dependencies]
# The scripted fake provider for end-to-end journeys in tests.
forge-model = { workspace = true, features = ["fake-provider"] }
async-trait = { workspace = true }
forge-test-support = { workspace = true, features = ["turn-records"] }
# A real `sshd` for the SSH execution target's end-to-end tests.
forge-tools = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
