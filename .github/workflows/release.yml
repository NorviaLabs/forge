name: Pre-release

on:
  push:
    tags:
      - "v*-alpha.*"
      - "v*-beta.*"

permissions:
  contents: read

jobs:
  # Windows is supported by running the Linux build under WSL2 — there is no
  # native Windows sandbox backend, so forge is not shipped as an .msvc binary.
  # That makes the Windows story a claim about WSL2 rather than about code we
  # test elsewhere, and the claim has never been checked.
  #
  # What matters is narrow: WSL2 has a real Linux kernel, so bubblewrap should
  # behave as it does on any Linux host — but unprivileged user namespaces have
  # historically been restricted there, and bwrap needs them. If that is off,
  # every Windows user silently drops to Manual mode and is asked about every
  # command, which is a materially different product from the one the docs
  # describe.
  #
  # This job runs the sandbox suite inside WSL2 to settle it. It is allowed to
  # fail the build: an unproven claim about a supported platform should be
  # loud, not a footnote. If the runner turns out not to support WSL2 at all,
  # the failure says so explicitly rather than passing by skipping.
  wsl2:
    name: WSL2 sandbox
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check WSL2 is actually available
        shell: pwsh
        run: |
          wsl --status
          if ($LASTEXITCODE -ne 0) {
            Write-Error "WSL is not available on this runner. Forge tells Windows users to run under WSL2, so that claim cannot be verified here — resolve by enabling WSL2, or by changing the documented Windows story."
            exit 1
          }
          wsl --version

      - name: Install a distribution
        shell: pwsh
        run: |
          wsl --install --no-launch -d Ubuntu-24.04
          wsl --set-default-version 2
          wsl -d Ubuntu-24.04 --exec /bin/bash -c "echo booted"

      # Single-line commands on purpose: pwsh hands multi-line strings to bash
      # with CRLF endings, and bash reads the \r as part of the command
      # (`$'\r': command not found`). Joining with && keeps it to one line.
      - name: Install toolchain and sandbox dependencies inside WSL2
        shell: pwsh
        run: |
          wsl -d Ubuntu-24.04 --exec /bin/bash -lc "sudo apt-get update && sudo apt-get install -y build-essential curl bubblewrap socat && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Only the permission model. The rest of the workspace is covered on the
      # Linux runner; what is unverified here is whether bubblewrap confines
      # anything under the WSL2 kernel, where unprivileged user namespaces have
      # historically been restricted.
      - name: Run the sandbox suite inside WSL2
        shell: pwsh
        run: |
          $repo = (Get-Location).Path -replace '\\','/' -replace '^([A-Za-z]):','/mnt/$1'
          # WSL mounts drives under a lowercase letter: D:\a\forge is /mnt/d/a/forge.
          $repo = $repo.Substring(0,6).ToLower() + $repo.Substring(6)
          wsl -d Ubuntu-24.04 --exec /bin/bash -lc "source ~/.cargo/env && cd '$repo' && CI=1 cargo test -p forge-tools --test permission_contract --test sandbox_enforcement"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  verify:
    name: Verify source
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Must match CI's install step. The sandbox enforcement suite panics
      # rather than skips when CI is set and nothing can confine, so without
      # these every tagged release fails at this gate.
      - name: Install sandbox dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --locked --no-fail-fast

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --package forge-cli --target ${{ matrix.target }}
      - name: Verify release binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/forge"
          "$binary" --version
          binary_version="$($binary --version | awk '{print $2}')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$binary_version" != "$tag_version" ]]; then
            echo "Tag version $tag_version does not match binary version $binary_version" >&2
            exit 1
          fi
      - name: Package binary
        shell: bash
        run: |
          archive="forge-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$archive"
          cp "target/${{ matrix.target }}/release/forge" "$archive/forge"
          cp README.md LICENSE "$archive/"
          tar -czf "$archive.tar.gz" "$archive"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-${{ matrix.target }}
          path: forge-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum forge-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/forge-*.tar.gz
            dist/SHA256SUMS
            install/forge-installer.sh
            install/forge-installer.ps1
