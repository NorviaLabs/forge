# Forge Dark — black-green terminal palette based on the approved Forge mock.
#
# The brand green lives in the ground, not in the signal: every neutral from
# `background` to `text_primary` is green-tinted, which is what makes the
# theme recognisable. The accent is deliberately *not* green, so that focus
# ("where am I") and success ("what happened") can never be confused. See
# `accent` below.
id = "forge-dark"
name = "Forge Dark"

background = "#0B0F0D"
background_deep = "#070A09"
surface = "#101513"
surface_raised = "#151D18"
surface_hover = "#1C2920"
border = "#29362E"
border_muted = "#1D2822"
text_primary = "#C7D1C8"
text_secondary = "#8C9A90"
text_muted = "#5F6C64"
# Focus. Once success (119°), warning (39°), error (6°) and the agent violet
# (274°) are placed, the only arc left with 60° of clearance from every
# outcome hue is 179–234°; this sits at 222°, keeping the theme's own
# saturation and lightness. 7.8:1 on `background`.
accent = "#8FA4D6"
accent_soft = "#262E40"
agent = "#B9A4C9"
success = "#9BD39A"
warning = "#D8B779"
error = "#D77D73"
info = "#8FBDB0"
diff_add = "#244A32"
diff_remove = "#542B31"
selection = "#303B55"
cursor = "#AEC0EA"
# Neutral, not teal: `tag` is a dedicated low-emphasis text step, and every
# other built-in already treats it as one (S <= 17). Forge Dark's was the
# only saturated value, which made "current"/"connected" labels read as a
# hue with a meaning of their own.
tag = "#B2BDB6"
search_match = "#394560"
waiting_border = "#D8B779"

[syntax]
comment = "#66746B"
keyword = "#C1A1D2"
string = "#A6D49C"
number = "#D8B779"
function = "#B8D5AD"
type = "#82B8AE"
variable = "#C7D1C8"
operator = "#91A097"
punctuation = "#91A097"
property = "#8FC2B4"
tag = "#8FC2B4"
attribute = "#D3B178"
default = "#C7D1C8"
