<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forge isolation</title>
  </head>
  <body>
    <!--
      Tauri's isolation pattern: every IPC message from the app frame passes
      through this sandboxed frame before it reaches Rust. Only Forge's own
      commands and the event plugin's listen/unlisten pass; anything else a
      compromised page sends is dropped here, on top of the capability check
      Rust performs.

      The script must be inline: Tauri serves only index.html from this
      directory (any other path is a 404) and hashes inline scripts into the
      frame's CSP.
    -->
    <script>
      const ALLOWED = new Set([
        "trust_status",
        "trust_workspace",
        "subscribe",
        "submit_prompt",
        "submit_images",
        "stop_turn",
        "approve_once",
        "deny",
        "decide_approval",
        "answer_question",
        "set_approve_all",
        "clear_approvals",
        "continue_turn",
        "stop_session",
        "close_session",
        "fork_session",
        "resume_session",
        "list_resumable_sessions",
        "rename_session",
        "pin_session",
        "cancel_queued",
        "compact_context",
        "set_thinking",
        "cancel_background",
        "resolve_child_approval",
        "child_transcript",
        "message_detail",
        "create_session",
        "select_session",
        "archive_session",
        "attach_worktree",
        "remove_worktree",
        "list_files",
        "read_file",
        "read_image",
        "git_status",
        "github_issues",
        "github_details",
        "github_logs",
        "github_create_pr",
        "github_refresh_pr",
        "github_apply_feedback",
        "git_diff",
        "git_operation",
        "write_file",
        "create_file",
        "create_dir",
        "rename_path",
        "delete_path",
        "search_files",
        "git_stage",
        "git_unstage",
        "git_commit",
        "git_branches",
        "git_switch_branch",
        "git_create_branch",
        "git_merge_branch",
        "git_rename_branch",
        "set_unsaved",
        "quit_app",
        "git_restore",
        "git_discard_hunk",
        "git_last_turn_files",
        "list_models",
        "session_details",
        "list_providers",
        "connect_provider",
        "import_provider_login",
        "disconnect_provider",
        "add_model",
        "save_custom_provider",
        "update_custom_provider",
        "remove_custom_provider",
        "set_model",
        "shell_open",
        "shell_write",
        "shell_resize",
        "shell_close",
        "plugin:event|listen",
        "plugin:event|unlisten",
      ]);
      window.__TAURI_ISOLATION_HOOK__ = (payload) =>
        payload && ALLOWED.has(payload.cmd) ? payload : null;
    </script>
  </body>
</html>
