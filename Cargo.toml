[workspace]
resolver = "2"
members = [
    "crates/forge-types",
    "crates/forge-config",
    "crates/forge-syntax",
    "crates/forge-tools",
    "crates/forge-model",
    "crates/forge-durable",
    "crates/forge-core",
    "crates/forge-mcp",
    "crates/forge-tui",
    "crates/forge-cli",
    "crates/forge-governance",
    "crates/forge-context",
    "crates/forge-connect",
    "crates/forge-test-support",
    "crates/forge-storage",
    "crates/forge-search",
]

[workspace.package]
version = "0.1.0-alpha.10"
edition = "2021"
license = "MIT"
repository = "https://github.com/NorviaLabs/forge"
rust-version = "1.97.1"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "1.1"
dirs = "6"
pathdiff = "0.2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ureq = { version = "2", features = ["json"] }
futures = "0.3"
bytes = "1"
jsonschema = "0.28"
crossterm = "0.28"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
regex = "1"
notify = "6"
fff-search = "0.10.1"
fff-grep = "0.10.1"
fff-query-parser = "0.10.1"

forge-types = { path = "crates/forge-types" }
forge-config = { path = "crates/forge-config" }
forge-syntax = { path = "crates/forge-syntax" }
forge-tools = { path = "crates/forge-tools" }
forge-model = { path = "crates/forge-model" }
forge-durable = { path = "crates/forge-durable" }
forge-core = { path = "crates/forge-core" }
forge-mcp = { path = "crates/forge-mcp" }
forge-tui = { path = "crates/forge-tui" }
forge-governance = { path = "crates/forge-governance" }
forge-context = { path = "crates/forge-context" }
forge-connect = { path = "crates/forge-connect" }
forge-test-support = { path = "crates/forge-test-support" }
forge-storage = { path = "crates/forge-storage" }
forge-search = { path = "crates/forge-search" }
sha2 = "0.10"
hex = "0.4"
