name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and format
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The sandbox that confines agent-spawned commands needs these on Linux:
      # bubblewrap enforces the filesystem and network boundary, socat relays
      # the egress proxy into the sandbox's network namespace.
      #
      # Without them the enforcement tests skip rather than fail, so CI would
      # stay green while testing nothing — which is the failure mode worth
      # spending an apt-get on. `sandbox_is_available_on_linux_in_ci` asserts
      # they are present, so removing this step breaks the build loudly.
      - name: Install sandbox dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # `--no-fail-fast` because cargo otherwise stops after the first test
      # binary that fails, and the remaining crates never run. A flaky test in
      # an early crate was silently preventing forge-tools' sandbox
      # enforcement suite from executing at all — CI reported a failure, but
      # not the one that mattered, and the coverage we most wanted was simply
      # skipped. Running everything also surfaces all failures in one pass
      # rather than one per push.
      - name: Run tests
        run: cargo test --workspace --all-targets --locked --no-fail-fast

  # Windows is supported by running the Linux build under WSL2 — there is no
  # native Windows sandbox backend, so forge is not shipped as an .msvc binary.
  # That makes the Windows story a claim about WSL2 rather than about code we
  # test elsewhere, and the claim has never been checked.
  #
  # What matters is narrow: WSL2 has a real Linux kernel, so bubblewrap should
  # behave as it does on any Linux host — but unprivileged user namespaces have
  # historically been restricted there, and bwrap needs them. If that is off,
  # every Windows user silently drops to Manual mode and is asked about every
  # command, which is a materially different product from the one the docs
  # describe.
  #
  # This job runs the sandbox suite inside WSL2 to settle it. It is allowed to
  # fail the build: an unproven claim about a supported platform should be
  # loud, not a footnote. If the runner turns out not to support WSL2 at all,
  # the failure says so explicitly rather than passing by skipping.
  wsl2:
    name: WSL2 sandbox
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check WSL2 is actually available
        shell: pwsh
        run: |
          wsl --status
          if ($LASTEXITCODE -ne 0) {
            Write-Error "WSL is not available on this runner. Forge tells Windows users to run under WSL2, so that claim cannot be verified here — resolve by enabling WSL2, or by changing the documented Windows story."
            exit 1
          }
          wsl --version

      - name: Install a distribution
        shell: pwsh
        run: |
          wsl --install --no-launch -d Ubuntu-24.04
          wsl --set-default-version 2
          wsl -d Ubuntu-24.04 --exec /bin/bash -c "echo booted"

      # Single-line commands on purpose: pwsh hands multi-line strings to bash
      # with CRLF endings, and bash reads the \r as part of the command
      # (`$'\r': command not found`). Joining with && keeps it to one line.
      - name: Install toolchain and sandbox dependencies inside WSL2
        shell: pwsh
        run: |
          wsl -d Ubuntu-24.04 --exec /bin/bash -lc "sudo apt-get update && sudo apt-get install -y build-essential curl bubblewrap socat && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.97.1"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Only the permission model. The rest of the workspace is covered on the
      # Linux runner; what is unverified here is whether bubblewrap confines
      # anything under the WSL2 kernel, where unprivileged user namespaces have
      # historically been restricted.
      - name: Run the sandbox suite inside WSL2
        shell: pwsh
        run: |
          $repo = (Get-Location).Path -replace '\\','/' -replace '^([A-Za-z]):','/mnt/$1'
          $repo = $repo.Substring(0,5).ToLower() + $repo.Substring(5)
          wsl -d Ubuntu-24.04 --exec /bin/bash -lc "source ~/.cargo/env && cd '$repo' && CI=1 cargo test -p forge-tools --test permission_contract --test sandbox_enforcement"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # Dependency advisories, duplicate/wildcard bans, and source allow-listing.
  # Separate job so it reports independently of the test result and runs in
  # parallel rather than adding to the critical path.
  #
  # This runs `cargo deny`, not `cargo audit`. `cargo audit` reads Cargo.lock
  # without feature or target resolution, so it flags advisories against crates
  # that are in the lockfile but never compiled. `deny.toml` sets `[graph]
  # targets` and `all-features = false`, so `cargo deny` evaluates the real
  # build graph. Policy and the rationale for each accepted advisory live in
  # deny.toml.
  deny:
    name: Dependency audit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Version-pinned rather than floating: a cargo-deny release that adds a
      # lint would otherwise fail an unrelated pull request. Bumping this is a
      # deliberate change, and dependabot does not manage it.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, bans and sources
        run: cargo deny check advisories bans sources
