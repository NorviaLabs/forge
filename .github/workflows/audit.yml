name: Audit

# Dependency vulnerability scanning (RustSec advisory database).
#
# This is required by branch protection on `main`. Keep the pull-request
# trigger unconditional so GitHub always receives the required check; path
# filters on a required workflow can leave the check permanently pending.

on:
  schedule:
    # Mondays, 06:17 UTC
    - cron: '17 6 * * 1'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # Fails on vulnerabilities. Unmaintained/unsound advisories are
        # reported but do not fail the job; see the PR description for why.
        run: cargo audit
