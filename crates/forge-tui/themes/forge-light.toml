# Forge Light — 2026 semantic tokens (see artifacts/astra-tui-2026/03-forge-design-system.md).
id = "forge-light"
name = "Forge Light"

background = "#F6F7F9"
background_deep = "#E4E9F0"
surface = "#EBEFF4"
surface_raised = "#FFFFFF"
# Ground hierarchy: surface > hover > selection on a light canvas, mirroring
# dark; selection stays light enough for the muted grey at WCAG AA on it.
surface_hover = "#DDE4EE"
border = "#B5BFCE"
border_muted = "#D5DDE8"
text_primary = "#202936"
text_secondary = "#47576A"
text_muted = "#657287"
accent = "#255CAA"
accent_soft = "#DFE8F6"
activity = "#80511B"
agent = "#47576A"
success = "#246040"
warning = "#745100"
error = "#A52D43"
info = "#335F82"
diff_add = "#D3EEDF"
diff_remove = "#F1DAE2"
selection = "#CAD7E8"
cursor = "#255CAA"
tag = "#47576A"
search_match = "#745100"
waiting_border = "#745100"
structure = "#47576A"
scan_band = "#F6F7F9"
zebra_row = "#EBEFF4"
# Editorial emphasis inside model prose (never chrome/status/code).
md_strong = "#965300"
md_emph = "#5F7300"
# Links are neutral information (the `info` family), a step deeper than the
# state teal so a URL reads at prose weight on this ground without competing
# with the focused chrome, which owns the blue accent.
link = "#00606E"

[syntax]
comment = "#545454"
keyword = "#005EB8"
string = "#18723B"
number = "#00717B"
function = "#202020"
type = "#00717B"
variable = "#202020"
operator = "#545454"
punctuation = "#545454"
property = "#00717B"
tag = "#00717B"
attribute = "#795B00"
default = "#202020"
