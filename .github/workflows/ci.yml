name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and format
    # GitHub-hosted, not Blacksmith: Blacksmith's transparent cache makes
    # network calls whenever git runs, and inside Forge those reach the egress
    # gateway (via HTTP_PROXY) in tests that assert which hosts git contacts.
    # Release's `verify` job runs the same suite and stays here too.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The sandbox that confines agent-spawned commands needs these on Linux:
      # bubblewrap enforces the filesystem and network boundary, socat relays
      # the egress proxy into the sandbox's network namespace.
      #
      # Without them the enforcement tests skip rather than fail, so CI would
      # stay green while testing nothing — which is the failure mode worth
      # spending an apt-get on. `sandbox_is_available_on_linux_in_ci` asserts
      # they are present, so removing this step breaks the build loudly.
      # GitHub-hosted Ubuntu 24.04 restricts unprivileged user namespaces via
      # AppArmor, which stops bubblewrap from creating the sandbox's network
      # namespace ("bwrap: loopback: Failed RTM_NEWADDR"). Lift it on the
      # runner so the real sandbox is exercised.
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The installer is what puts bubblewrap and socat on a user's machine, so
      # a regression there costs every new Linux user the sandbox silently.
      - name: Test the installer
        run: sh install/test-installer.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # `--no-fail-fast` because cargo otherwise stops after the first test
      # binary that fails, and the remaining crates never run. A flaky test in
      # an early crate was silently preventing forge-tools' sandbox
      # enforcement suite from executing at all — CI reported a failure, but
      # not the one that mattered, and the coverage we most wanted was simply
      # skipped. Running everything also surfaces all failures in one pass
      # rather than one per push.
      - name: Run tests
        run: cargo test --workspace --all-targets --locked --no-fail-fast
      # The desktop app is a separate Cargo workspace so this job never needs
      # Tauri or WebKitGTK. Fail loudly if either ever leaks into the main
      # dependency graph (forge-cli, the TUI).
      - name: Main build stays free of Tauri and WebKit
        run: |
          if grep -Eq '^name = "(tauri|wry|tao|webkit2gtk)' Cargo.lock; then
            echo "Tauri/WebKit crates found in the main Cargo.lock" >&2
            exit 1
          fi

  # The Tauri desktop app (crates/forge-desktop, its own workspace). Linux
  # needs the WebKitGTK/GTK development packages; this is the only job that
  # installs them. The self-test launches the real app in its webview (under
  # Xvfb on Linux), runs one turn on the offline mock, and exits 0/1.
  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/forge-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: crates/forge-desktop -> target
      - name: Install WebKitGTK and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev xvfb lsof
      # pnpm comes from Corepack at the exact version package.json pins.
      - name: Build the UI
        working-directory: crates/forge-desktop/ui
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          pnpm build:self-test
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --locked --features self-test -- -D warnings
      - name: Test
        run: |
          cargo test --locked
          cargo test --locked --features self-test
      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --features self-test
          xvfb-run -a ./target/debug/forge-desktop --self-test
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --features self-test
          ./target/debug/forge-desktop --self-test
      # A release build must not accept --self-test at all. Check the exact
      # refusal (exit 2 from argument parsing, with its message): any other
      # failure, e.g. no display or an untrusted directory, would also be
      # non-zero and prove nothing.
      - name: Release build rejects --self-test
        run: |
          cargo build --locked --release
          set +e
          ./target/release/forge-desktop --self-test 2> refusal.txt
          code=$?
          set -e
          cat refusal.txt
          test "$code" -eq 2
          grep -q 'unknown argument `--self-test`' refusal.txt
      # The release binary carries the release identity and none of the
      # self-test code. (Self-test builds once silently embedded the release
      # config; this also guards the reverse.)
      - name: Release binary identity and no self-test markers
        run: |
          strings target/release/forge-desktop > release-strings.txt
          grep -q 'dev\.forge\.desktop' release-strings.txt
          for marker in 'dev.forge.desktop.test' 'forge-selftest-emit-probe' 'SELF_TEST PASS' 'SELF_TEST FAIL'; do
            if grep -qF "$marker" release-strings.txt; then
              echo "release binary contains self-test marker: $marker" >&2
              exit 1
            fi
          done

  # Dependency advisories, duplicate/wildcard bans, and source allow-listing.
  # Separate job so it reports independently of the test result and runs in
  # parallel rather than adding to the critical path.
  #
  # This runs `cargo deny`, not `cargo audit`. `cargo audit` reads Cargo.lock
  # without feature or target resolution, so it flags advisories against crates
  # that are in the lockfile but never compiled. `deny.toml` sets `[graph]
  # targets` and `all-features = false`, so `cargo deny` evaluates the real
  # build graph. Policy and the rationale for each accepted advisory live in
  # deny.toml.
  deny:
    name: Dependency audit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Version-pinned rather than floating: a cargo-deny release that adds a
      # lint would otherwise fail an unrelated pull request. Bumping this is a
      # deliberate change, and dependabot does not manage it.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, bans and sources
        run: cargo deny check advisories bans sources
