<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Forge TUI — Command palette</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="frame">
    <div class="statusbar">
      <div class="brand">forge</div>
      <span class="pill ok">idle</span>
      <span class="sep">·</span>
      <span>provider/model</span>
      <div class="right"><span class="pill info">connect</span></div>
    </div>

    <div class="panel palette">
      <div class="panel-title">command palette</div>
      <div class="row selected">/status <span>show session diagnostics</span></div>
      <div class="row">/model <span>switch active model</span></div>
      <div class="row">/connect <span>manage provider access</span></div>
      <div class="row">/compact <span>reduce context usage</span></div>
      <div class="row">/cost <span>view token totals</span></div>
    </div>
  </div>
</body>
</html>
