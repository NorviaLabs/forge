# Built-in provider definitions (xai), embedded at compile time.
# Fields: `ProviderSpec` in src/profile.rs.

[[providers]]
id = "xai"
title = "xAI Grok"
label = "API"
provider = "xai"
provider_label = "xAI"
description = "Grok via xAI OAuth (not API key); xai/* models"
base_url = "https://api.x.ai/v1"
base_url_env = ["XAI_API_BASE"]
api_key_env = [
    "XAI_API_KEY",
    "GROK_CODE_XAI_API_KEY",
]
wire = "chat-completions"
attach = "bearer"
default_models = ["xai/grok-3"]
models_dev_providers = ["xai"]
auth_url = "https://auth.x.ai"
import_aliases = ["xai"]
billing_url = "https://console.x.ai/"
billing_note = "xAI does not expose account balance through the connected OAuth token."
effort_family = "xai"
model_provider_prefix = "xai"
route_id = "xai-api"
catalog_mode = "live+registry"

[providers.auth]
client_id = "b1a00492-073a-47ea-816f-4c329264a828"
flavor = "rfc8628"
issuer = "https://auth.x.ai"
kind = "oauth-device"
prompt = "browser"
scopes = [
    "openid",
    "profile",
    "email",
    "offline_access",
    "api:access",
    "grok-cli:access",
]

[providers.catalog]
kind = "openai-models"
