# Forge Midnight (Calm) — recolored dark palette for the Forge TUI.
# Drop-in replacement for crates/forge-tui/themes/forge-midnight.toml.
# Same keys/structure as the original; consolidated to ~6 hues (neutral,
# sage accent, slate blue status/info, muted mauve agent, ochre warning,
# terracotta error, sage green success) instead of the original's
# blue/violet/amber/cyan/red/green mix. Every value verified >=4.5:1
# contrast against the background/surface it's actually rendered on.
id = "forge-midnight"
name = "Forge Midnight"

background = "#17171A"
background_deep = "#0F0F11"
surface = "#1C1C1F"
surface_raised = "#232326"
surface_hover = "#2A2A2E"
border = "#34333A"
border_muted = "#26262A"
text_primary = "#D8D6D0"
text_secondary = "#A49E90"
text_muted = "#908D83"
accent = "#8FB3A8"
accent_soft = "#1E2B28"
agent = "#A79BB0"
success = "#9AB68F"
warning = "#B99A5B"
error = "#C17C62"
info = "#93A4C2"
diff_add = "#213026"
diff_remove = "#332420"
selection = "#25332F"
cursor = "#EDEBE4"
user_gutter_active = "#A3C7BC"
tag = "#B0AA9C"
search_match = "#332C1E"

[syntax]
comment = "#A49E90"
keyword = "#93A4C2"
string = "#B99A5B"
number = "#93A4C2"
function = "#A79BB0"
type = "#8FB3A8"
variable = "#D8D6D0"
operator = "#A49E90"
punctuation = "#A49E90"
property = "#93A4C2"
tag = "#93A4C2"
attribute = "#B99A5B"
default = "#D8D6D0"
