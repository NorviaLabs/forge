# Tokyo Night Storm — storm variant (https://github.com/folke/tokyonight.nvim)
# mapped onto the Forge TUI semantic theme schema. Background, foreground, and
# accent hues use the published storm palette; surface elevation steps follow
# the bg / bg_dark / bg_highlight scale.
id = "tokyo-night-storm"
name = "Tokyo Night Storm"

background = "#24283B"
background_deep = "#1F2335"
surface = "#1B1E2D"
surface_raised = "#292E42"
surface_hover = "#2F3549"
border = "#3B4261"
border_muted = "#292E42"
text_primary = "#C0CAF5"
text_secondary = "#A9B1D6"
text_muted = "#565F89"
accent = "#7AA2F7"
accent_soft = "#394B70"
agent = "#BB9AF7"
success = "#9ECE6A"
warning = "#E0AF68"
error = "#F7768E"
info = "#7DCFFF"
diff_add = "#1E3A3D"
diff_remove = "#3A2528"
selection = "#2E3C64"
cursor = "#C0CAF5"
user_gutter_active = "#7DCFFF"
tag = "#565F89"
search_match = "#3D59A1"

[syntax]
comment = "#565F89"
keyword = "#BB9AF7"
string = "#9ECE6A"
number = "#FF9E64"
function = "#7AA2F7"
type = "#2AC3DE"
variable = "#C0CAF5"
operator = "#89DDFF"
punctuation = "#A9B1D6"
property = "#7DCFFF"
tag = "#F7768E"
attribute = "#E0AF68"
default = "#C0CAF5"
