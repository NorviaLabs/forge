# Forge Dark: cool graphite neutrals with one blue for action, selection and focus.
id = "forge-dark"
name = "Forge Dark"

background = "#0F1115"
background_deep = "#0B0D10"
surface = "#181B21"
surface_raised = "#1F232B"
# Ground hierarchy: surface < hover < selection, so a hovered row never reads
# as a selected one. Selection stays at the darkest step that keeps the muted
# `tag`/secondary grey at WCAG AA (4.5:1) on the selected ground.
surface_hover = "#272C36"
border = "#6C7686"
border_muted = "#2A2F38"
text_primary = "#E6E8EB"
text_secondary = "#B6BCC7"
text_muted = "#9AA2AF"
accent = "#6E9BFF"
accent_soft = "#1C2740"
activity = "#E5BB80"
agent = "#B6BCC7"
success = "#7FD69A"
warning = "#E8B04A"
error = "#F47C76"
info = "#9FC9E2"
diff_add = "#14301F"
diff_remove = "#3A1A1D"
selection = "#27344F"
cursor = "#6E9BFF"
tag = "#B6BCC7"
search_match = "#E8B04A"
waiting_border = "#E8B04A"
structure = "#B6BCC7"
scan_band = "#0F1115"
zebra_row = "#181B21"
# Editorial emphasis inside model prose (never chrome/status/code).
# Warm emphasis remains distinct from the neutral activity and status chrome.
md_strong = "#F5F6F8"
md_emph = "#C7D96B"
# Links stay distinct from the blue focus accent at ordinary prose weight.
link = "#7CC4D6"

[syntax]
comment = "#A0A0A0"
keyword = "#439EFD"
string = "#5BDB87"
number = "#1DB0BB"
function = "#EBEBEB"
type = "#1DB0BB"
variable = "#EBEBEB"
operator = "#A0A0A0"
punctuation = "#A0A0A0"
property = "#1DB0BB"
tag = "#1DB0BB"
attribute = "#E6C66A"
default = "#EBEBEB"
