# Forge Light: cool graphite neutrals with one blue for action, selection and focus.
id = "forge-light"
name = "Forge Light"

background = "#F7F8FA"
background_deep = "#ECEEF2"
surface = "#F0F2F5"
surface_raised = "#FFFFFF"
# Ground hierarchy: surface > hover > selection on a light canvas, mirroring
# dark; selection stays light enough for the muted grey at WCAG AA on it.
surface_hover = "#E3E6EC"
border = "#757F8F"
border_muted = "#DCDFE5"
text_primary = "#14171C"
text_secondary = "#434A56"
text_muted = "#565E6C"
accent = "#2A57C8"
accent_soft = "#E3EAFC"
activity = "#80511B"
agent = "#434A56"
success = "#1D6636"
warning = "#754E00"
error = "#B0251D"
info = "#335F82"
diff_add = "#D9F2E0"
diff_remove = "#F8DCDC"
selection = "#D3DEFA"
cursor = "#2A57C8"
tag = "#434A56"
search_match = "#754E00"
waiting_border = "#754E00"
structure = "#434A56"
scan_band = "#F7F8FA"
zebra_row = "#F0F2F5"
# Editorial emphasis inside model prose (never chrome/status/code).
md_strong = "#0B0D10"
md_emph = "#516200"
# Links are neutral information (the `info` family), a step deeper than the
# state teal so a URL reads at prose weight on this ground without competing
# with the focused chrome, which owns the blue accent.
link = "#0F5F70"

[syntax]
comment = "#545454"
keyword = "#005EB8"
string = "#18723B"
number = "#00717B"
function = "#202020"
type = "#00717B"
variable = "#202020"
operator = "#545454"
punctuation = "#545454"
property = "#00717B"
tag = "#00717B"
attribute = "#795B00"
default = "#202020"
