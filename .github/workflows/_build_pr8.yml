name: Build PR8 runtime ownership routing
on:
  push:
    branches:
      - refactor/multisession-08-runtime-ownership-routing
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/multisession-08-runtime-ownership-routing
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply and validate ownership routing
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          p = Path("crates/forge-tui/src/app/selection.rs")
          p.write_text(r'''//! Which runtime owns the Session an operator action addresses.
          //!
          //! Forge has two runtime ownership modes during the multisession migration:
          //! a legacy directly-owned AgentSession for single-session workspaces, and
          //! repository-supervised Session actors addressed through snapshots + commands.
          //!
          //! Routing must depend on ownership, not on whether a Session happens to be the
          //! repository's primary worktree. Once the primary is adopted by the supervisor
          //! it must automatically take the supervised path like every other Session.

          use super::*;

          /// Runtime ownership behind the currently selected Session.
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub(crate) enum SelectedRuntime {
              /// Legacy single-session mode: TuiApp owns the AgentSession directly.
              Direct,
              /// Repository mode: a supervisor actor owns the Session.
              Supervised(uuid::Uuid),
          }

          impl TuiApp {
              pub(crate) fn selected_runtime(&self) -> SelectedRuntime {
                  if self
                      .supervisor
                      .as_ref()
                      .is_some_and(|supervisor| supervisor.snapshots.contains_key(&self.selected_session_id))
                  {
                      SelectedRuntime::Supervised(self.selected_session_id)
                  } else {
                      SelectedRuntime::Direct
                  }
              }

              pub(crate) fn selected_is_supervised(&self) -> bool {
                  matches!(self.selected_runtime(), SelectedRuntime::Supervised(_))
              }

              /// The supervisor's latest view of the selected Session, when that
              /// Session is actor-owned rather than directly owned by the TUI.
              pub(crate) fn selected_snapshot(&self) -> Option<&forge_session::SessionRuntimeSnapshot> {
                  match self.selected_runtime() {
                      SelectedRuntime::Direct => None,
                      SelectedRuntime::Supervised(session_id) => self
                          .supervisor
                          .as_ref()
                          .and_then(|supervisor| supervisor.snapshots.get(&session_id)),
                  }
              }

              /// The label of the selected Session, for messages that name it.
              pub(crate) fn selected_session_label(&self) -> String {
                  self.session_chrome
                      .iter()
                      .find(|session| session.session_id == self.selected_session_id)
                      .map(|session| session.label.clone())
                      .unwrap_or_else(|| "the selected session".into())
              }

              /// Gate an operation that has not yet been routed through the supervisor.
              ///
              /// This is intentionally about runtime ownership, not primary-vs-sibling
              /// identity. As migration progresses these gates disappear operation by
              /// operation until repository mode no longer needs direct ownership.
              pub(crate) fn require_direct_session(&mut self, action: &str) -> bool {
                  if !self.selected_is_supervised() {
                      return true;
                  }
                  let label = self.selected_session_label();
                  self.set_feedback(
                      FeedbackSeverity::Warn,
                      format!("{action} is not available for supervised session '{label}' yet"),
                  );
                  false
              }
          }
          ''')

          root = Path("crates/forge-tui/src/app")
          replacements = [
              ("SelectedRuntime::Sibling", "SelectedRuntime::Supervised"),
              ("SelectedRuntime::Primary", "SelectedRuntime::Direct"),
              ("selected_is_sibling", "selected_is_supervised"),
              ("require_primary_task", "require_direct_session"),
          ]
          for q in root.rglob("*.rs"):
              if q == p:
                  continue
              s = q.read_text()
              for old, new in replacements:
                  s = s.replace(old, new)
              s = s.replace("A sibling's approval belongs to the supervisor's actor", "A supervised Session's approval belongs to its actor")
              s = s.replace("a sibling's question was asked by", "a supervised Session's question was asked by")
              s = s.replace("while a sibling is", "while a supervised Session is")
              s = s.replace("without_a_supervisor_the_primary_is_always_the_selected_runtime", "without_a_supervisor_the_session_is_direct_owned")
              s = s.replace("Primary-only actions", "Direct-only actions")
              q.write_text(s)

          p = Path("crates/forge-tui/src/app/tests/multi_task.rs")
          s = p.read_text()
          old = r'''#[tokio::test]
          async fn without_a_supervisor_the_session_is_direct_owned() {
              let (_dir, mut app) = focus_test_app().await;
              assert_eq!(app.selected_runtime(), SelectedRuntime::Direct);
              assert!(!app.selected_is_supervised());
              assert!(app.selected_snapshot().is_none());
              // Direct-only actions must stay reachable in single-task mode.
              assert!(app.require_direct_session("/clear"));
          }
          '''
          new = old + r'''
          #[tokio::test]
          async fn supervisor_snapshot_makes_the_selected_session_supervised() {
              let (_dir, mut app, handle) = app_with_supervisor().await;
              app.focus_block(FocusBlock::TaskStrip);
              app.handle_key(press(KeyCode::Char('n'), KeyModifiers::NONE))
                  .await
                  .unwrap();
              let session = wait_for_chrome_session(&mut app, |item| item.label.is_empty()).await;

              app.handle_key(press(KeyCode::Right, KeyModifiers::NONE))
                  .await
                  .unwrap();
              app.handle_key(press(KeyCode::Enter, KeyModifiers::NONE))
                  .await
                  .unwrap();

              assert_eq!(
                  app.selected_runtime(),
                  SelectedRuntime::Supervised(session.session_id)
              );
              assert!(app.selected_is_supervised());
              assert_eq!(
                  app.selected_snapshot().map(|snapshot| snapshot.task.session_id),
                  Some(session.session_id)
              );
              assert!(
                  !app.require_direct_session("/clear"),
                  "direct-only operations must refuse a supervisor-owned Session"
              );

              handle
                  .command(forge_session::SupervisorCommand::Shutdown)
                  .await
                  .unwrap();
          }
          '''
          assert old in s, "direct ownership regression test not found"
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          git diff --check
          cargo check --workspace --all-targets --locked
          cargo test -p forge-tui --lib --locked app::tests::multi_task
          cargo test -p forge-tui --lib --locked app::questions::tests
          cargo test -p forge-tui --lib --locked app::approvals::tests
          git rm .github/workflows/_build_pr8.yml
          git add -A
          git commit -m "refactor(tui): route Sessions by runtime ownership"
          git push origin HEAD:refactor/multisession-08-runtime-ownership-routing
