# Catppuccin Mocha — official palette (https://github.com/catppuccin/catppuccin)
# mapped onto the Forge TUI semantic theme schema. Base, surface, overlay, and
# accent hues use the published Mocha values; syntax roles follow the Catppuccin
# code-editor style guide.
id = "catppuccin-mocha"
name = "Catppuccin Mocha"

background = "#1E1E2E"
background_deep = "#11111B"
surface = "#181825"
surface_raised = "#313244"
surface_hover = "#45475A"
border = "#585B70"
border_muted = "#45475A"
text_primary = "#CDD6F4"
text_secondary = "#BAC2DE"
text_muted = "#6C7086"
accent = "#89B4FA"
accent_soft = "#252A3F"
agent = "#CBA6F7"
success = "#A6E3A1"
warning = "#F9E2AF"
error = "#F38BA8"
info = "#89DCEB"
diff_add = "#1A2E1F"
diff_remove = "#2E1A22"
selection = "#45475A"
cursor = "#F5E0DC"
tag = "#7F849C"
search_match = "#313244"
waiting_border = "#F9E2AF"

[syntax]
comment = "#9399B2"
keyword = "#CBA6F7"
string = "#A6E3A1"
number = "#FAB387"
function = "#89B4FA"
type = "#F9E2AF"
variable = "#CDD6F4"
operator = "#89DCEB"
punctuation = "#9399B2"
property = "#89B4FA"
tag = "#F38BA8"
attribute = "#F9E2AF"
default = "#CDD6F4"
