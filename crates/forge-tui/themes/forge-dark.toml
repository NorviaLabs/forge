# Forge Dark — 2026 semantic tokens (see artifacts/astra-tui-2026/03-forge-design-system.md).
id = "forge-dark"
name = "Forge Dark"

background = "#141414"
background_deep = "#080808"
surface = "#1E1E1E"
surface_raised = "#1E1E1E"
# Hover is a pointer affordance, not a selection: it sits a clear step above
# `surface` while staying below `selection` (#292929), so the two never read
# as the same state.
surface_hover = "#2E2E2E"
border = "#343434"
border_muted = "#292929"
text_primary = "#EBEBEB"
text_secondary = "#A0A0A0"
text_muted = "#757575"
accent = "#439EFD"
accent_soft = "#182B3D"
activity = "#FFA31D"
agent = "#A0A0A0"
success = "#5BDB87"
warning = "#E6C66A"
error = "#F26D78"
info = "#1DB0BB"
diff_add = "#183A28"
diff_remove = "#4A2026"
selection = "#292929"
cursor = "#439EFD"
tag = "#A0A0A0"
search_match = "#E6C66A"
waiting_border = "#E6C66A"
structure = "#A0A0A0"
scan_band = "#141414"
zebra_row = "#1A1A1A"
# Editorial emphasis inside model prose (never chrome/status/code).
# md_strong shares the active-work orange family (36°); md_emph is a
# greenish yellow at 70°, between warning (45°) and success (141°).
md_strong = "#FFA31D"
md_emph = "#C7D96B"

[syntax]
comment = "#A0A0A0"
keyword = "#439EFD"
string = "#5BDB87"
number = "#1DB0BB"
function = "#EBEBEB"
type = "#1DB0BB"
variable = "#EBEBEB"
operator = "#A0A0A0"
punctuation = "#A0A0A0"
property = "#1DB0BB"
tag = "#1DB0BB"
attribute = "#E6C66A"
default = "#EBEBEB"
