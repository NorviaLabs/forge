# Forge Daylight (Calm) — recolored light palette for the Forge TUI.
# Same key structure as forge-midnight(-calm).toml, so it's a drop-in
# replacement for whatever light theme file currently ships (rename the
# id/name below to match your actual light-theme file if different).
# Consolidated to the same ~6 hues as the calm dark theme (neutral warm
# paper, sage accent, slate blue status/info, muted mauve agent, ochre
# warning, terracotta error, sage green success) instead of the current
# theme's flat black-text-on-pale-blue-gray with orange/red file icons.
# Every value verified >=4.5:1 contrast against the background/surface
# it's actually rendered on.
id = "forge-daylight"
name = "Forge Daylight"
 
background = "#F6F2EA"
background_deep = "#F6F2EA"
surface = "#FAF7F1"
surface_raised = "#FFFFFF"
surface_hover = "#F0EBDD"
border = "#DDD6C8"
border_muted = "#E8E2D4"
text_primary = "#33312B"
text_secondary = "#665F52"
text_muted = "#746E5F"
accent = "#4B776B"
accent_soft = "#E3ECE8"
agent = "#7A6880"
success = "#5A774C"
warning = "#886A34"
error = "#A15B41"
info = "#5B6F92"
diff_add = "#E6EEE1"
diff_remove = "#F3E4DD"
selection = "#E3E8E0"
cursor = "#1F1E1B"
user_gutter_active = "#4B776B"
tag = "#5F5749"
search_match = "#F1E7D2"
 
[syntax]
comment = "#665F52"
keyword = "#5B6F92"
string = "#886A34"
number = "#5B6F92"
function = "#7A6880"
type = "#4B776B"
variable = "#33312B"
operator = "#665F52"
punctuation = "#665F52"
property = "#5B6F92"
tag = "#5B6F92"
attribute = "#886A34"
default = "#33312B"
 
