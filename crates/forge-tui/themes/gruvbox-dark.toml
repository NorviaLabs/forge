# Gruvbox Dark — retro groove palette (https://github.com/morhetz/gruvbox)
# mapped onto the Forge TUI semantic theme schema. bg/fg and accent hues use
# the published medium-contrast dark values; surface elevation steps follow
# the bg0..bg4 scale.
id = "gruvbox-dark"
name = "Gruvbox Dark"

background = "#282828"
background_deep = "#1D2021"
surface = "#3C3836"
surface_raised = "#504945"
surface_hover = "#665C54"
border = "#7C6F64"
border_muted = "#504945"
text_primary = "#EBDBB2"
text_secondary = "#D5C4A9"
text_muted = "#A89984"
accent = "#FE8019"
accent_soft = "#3D2F1F"
agent = "#D3869B"
success = "#B8BB26"
warning = "#FABD2F"
error = "#FB4934"
info = "#83A598"
diff_add = "#2D3A22"
diff_remove = "#3D2220"
selection = "#504945"
cursor = "#FBF1C7"
user_gutter_active = "#83A598"
tag = "#A89984"
search_match = "#3C3836"
waiting_border = "#FABD2F"
approval_accent = "#FE8019"

[syntax]
comment = "#928374"
keyword = "#FB4934"
string = "#B8BB26"
number = "#D3869B"
function = "#FABD2F"
type = "#FE8019"
variable = "#EBDBB2"
operator = "#FE8019"
punctuation = "#A89984"
property = "#83A598"
tag = "#8EC07C"
attribute = "#FABD2F"
default = "#EBDBB2"
